plugins {
    id "java"
    id 'org.springframework.boot' version '4.1.1'
    id "io.spring.dependency-management" version "1.1.7"
}

group = "de.tum.cit.aet"
version = "0.1.1"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext['hikaricp.version'] = '7.1.0'
ext['liquibase.version'] = '5.0.4'
ext['mysql.version'] = '26.7.0'

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-webmvc"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
    testImplementation "org.springframework.boot:spring-boot-starter-security-test"
    testImplementation "org.testcontainers:testcontainers-mysql"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test") {
    useJUnitPlatform()
}

// The production JAR contains the same-origin Angular client. Docker supplies its prebuilt bundle.
def skipClient = providers.gradleProperty('skipClient').isPresent()
tasks.register('clientInstall', Exec) {
    workingDir 'client'
    commandLine 'npm', 'ci', '--no-audit', '--no-fund'
    inputs.files('client/package.json', 'client/package-lock.json')
    outputs.dir('client/node_modules')
    onlyIf { !skipClient }
}
tasks.register('clientBuild', Exec) {
    dependsOn 'clientInstall'
    workingDir 'client'
    commandLine 'npm', 'run', 'build'
    inputs.files(fileTree('client') { exclude 'node_modules/**', 'dist/**', '.angular/**' })
    outputs.dir('client/dist')
    onlyIf { !skipClient }
}
tasks.named('processResources') {
    dependsOn 'clientBuild'
    from('client/dist/browser') { into 'static' }
}
