services:
  telemetry:
    container_name: artemis-telemetry
    image: ls1tum/artemis-telemetry:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - config/telemetry.env
    environment:
      # Set here, not in config/telemetry.env, so a server whose env file still names MySQL needs no manual edit.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/artemis-telemetry
      SPRING_DATASOURCE_USERNAME: telemetry
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file next to docker-compose.yml (see .env.example)}
    ports:
      - '127.0.0.1:8080:8080'
    expose:
      - '8080'
    healthcheck:
      test: wget -nv -t1 --spider http://localhost:8080/management/health || exit 1
      start_period: 600s
      interval: 1s
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  postgres:
    container_name: postgres
    image: postgres:19
    volumes:
      # PostgreSQL 18+ images keep their data in a major-version subdirectory below this mount.
      - artemis-telemetry-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file next to docker-compose.yml (see .env.example)}
      POSTGRES_DB: artemis-telemetry
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Use TCP: during first start the entrypoint runs a temporary server that only listens on the socket.
      test: pg_isready -h 127.0.0.1 -U telemetry -d artemis-telemetry
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: always

volumes:
  artemis-telemetry-postgres-data:
    name: artemis-telemetry-postgres-data
