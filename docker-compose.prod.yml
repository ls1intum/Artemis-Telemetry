services:
  telemetry:
    environment:
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"

  nginx:
    container_name: nginx
    image: nginx:1.31.10-alpine-slim
    ports:
      - '80:80'
      - '443:443'
    expose:
      - '80'
      - '443'
    healthcheck:
      # The Alpine image has no `service` command. Check that nginx runs and that port 80 answers with its HTTPS redirect.
      test: ["CMD-SHELL", "pidof nginx >/dev/null && wget -q -S --spider http://127.0.0.1/ 2>&1 | grep -q 'HTTP/1.1 301'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/telemetry.artemis.cit.tum.de80:/etc/nginx/sites-enabled/telemetry.artemis.cit.tum.de80:ro
      - ./config/nginx/telemetry.artemis.cit.tum.de443:/etc/nginx/sites-enabled/telemetry.artemis.cit.tum.de443:ro
      - type: bind
        source: '/var/lib/rbg-cert/live/host:f:asevm81.cit.tum.de.fullchain.pem'
        target: '/certs/fullchain.pem'
      - type: bind
        source: '/var/lib/rbg-cert/live/host:f:asevm81.cit.tum.de.privkey.pem'
        target: '/certs/privkey.pem'
